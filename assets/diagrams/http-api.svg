<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
<title id="t">Flujo HttpClient y API</title><desc id="d">La página llama al servicio, HttpClient consulta la API, la respuesta se transforma y actualiza el Signal.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#f9f7ff"/></linearGradient>
 <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#334155" flood-opacity=".12"/></filter>
 <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path class="flow" d="M0 0L12 6L0 12Z" fill="#7c3aed"/></marker>
 <style>
  .flow{stroke-dasharray:10 8;animation:dash 2.1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-36}}
 </style>
</defs>
<rect width="1200" height="600" rx="34" fill="url(#bg)"/>
<text x="58" y="66" font-family="Inter,Arial" font-size="31" font-weight="900" fill="#172033">Viaje de una petición HTTP</text>
<text x="58" y="101" font-family="Inter,Arial" font-size="16" fill="#64748b">La API externa nunca escribe directamente en nuestro estado.</text>

<g filter="url(#s)">
 <rect x="65" y="165" width="180" height="125" rx="25" fill="#fff"/>
 <text x="155" y="207" text-anchor="middle" font-family="Inter,Arial" font-size="16" font-weight="900" fill="#172033">Página</text>
 <text x="155" y="236" text-anchor="middle" font-family="monospace" font-size="12" fill="#2563eb">importar()</text>
 <text x="155" y="261" text-anchor="middle" font-family="Inter,Arial" font-size="12" fill="#64748b">clic del usuario</text>
</g>
<path class="flow" d="M245 227 H322" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/>
<g filter="url(#s)">
 <rect x="335" y="165" width="180" height="125" rx="25" fill="#ecfeff" stroke="#67e8f9"/>
 <text x="425" y="207" text-anchor="middle" font-family="Inter,Arial" font-size="16" font-weight="900" fill="#0e7490">Servicio</text>
 <text x="425" y="236" text-anchor="middle" font-family="monospace" font-size="12" fill="#155e75">importarDesdeApi()</text>
</g>
<path class="flow" d="M515 227 H592" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/>
<g filter="url(#s)">
 <rect x="605" y="165" width="180" height="125" rx="25" fill="#eff6ff" stroke="#93c5fd"/>
 <text x="695" y="207" text-anchor="middle" font-family="Inter,Arial" font-size="16" font-weight="900" fill="#1d4ed8">HttpClient</text>
 <text x="695" y="236" text-anchor="middle" font-family="monospace" font-size="12" fill="#2563eb">GET /users</text>
</g>
<path class="flow" d="M785 227 H862" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/>
<g filter="url(#s)">
 <rect x="875" y="150" width="250" height="155" rx="28" fill="#fff7ed" stroke="#fdba74"/>
 <text x="1000" y="195" text-anchor="middle" font-family="Inter,Arial" font-size="17" font-weight="900" fill="#c2410c">API externa</text>
 <text x="1000" y="226" text-anchor="middle" font-family="Inter,Arial" font-size="12" fill="#9a3412">JSONPlaceholder</text>
 <rect x="925" y="248" width="150" height="34" rx="10" fill="#fff"/>
 <text x="1000" y="269" text-anchor="middle" font-family="monospace" font-size="11" fill="#92400e">UsuarioApi[]</text>
</g>

<path class="flow" d="M1000 305 C1000 362 760 362 760 400" stroke="#7c3aed" stroke-width="4" fill="none" marker-end="url(#a)"/>
<g filter="url(#s)">
 <rect x="600" y="400" width="320" height="125" rx="26" fill="#f5f3ff" stroke="#c4b5fd"/>
 <text x="760" y="438" text-anchor="middle" font-family="Inter,Arial" font-size="16" font-weight="900" fill="#6d28d9">Transformación</text>
 <text x="760" y="468" text-anchor="middle" font-family="monospace" font-size="12" fill="#7c3aed">map(UsuarioApi → Estudiante)</text>
 <text x="760" y="496" text-anchor="middle" font-family="Inter,Arial" font-size="12" fill="#64748b">adaptamos datos externos al modelo interno</text>
</g>
<path class="flow" d="M600 462 H492" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/>
<g filter="url(#s)">
 <rect x="285" y="400" width="195" height="125" rx="26" fill="#ecfdf5" stroke="#86efac"/>
 <text x="382" y="442" text-anchor="middle" font-family="Inter,Arial" font-size="16" font-weight="900" fill="#166534">Signal</text>
 <text x="382" y="471" text-anchor="middle" font-family="monospace" font-size="12" fill="#15803d">agregarVarios()</text>
 <text x="382" y="497" text-anchor="middle" font-family="Inter,Arial" font-size="12" fill="#64748b">estado actualizado</text>
</g>
<path class="flow" d="M285 462 H205" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/>
<g filter="url(#s)">
 <rect x="65" y="400" width="128" height="125" rx="26" fill="#fdf2f8" stroke="#f9a8d4"/>
 <text x="129" y="442" text-anchor="middle" font-family="Inter,Arial" font-size="15" font-weight="900" fill="#be185d">Template</text>
 <text x="129" y="472" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#9d174d">nuevas tarjetas</text>
</g>
<text x="600" y="565" text-anchor="middle" font-family="Inter,Arial" font-size="14" font-weight="800" fill="#172033">Frontera limpia: API externa → transformación → modelo interno → estado → interfaz</text>
</svg>