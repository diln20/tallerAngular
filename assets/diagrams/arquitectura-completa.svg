<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d">
<title id="t">Arquitectura completa de Angular Aula</title><desc id="d">Mapa de App, Router, páginas, componentes, servicio, Signals, localStorage y API.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8f7ff"/><stop offset="1" stop-color="#eef9ff"/></linearGradient>
 <linearGradient id="app" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
