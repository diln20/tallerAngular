 </style>
</defs>
<rect width="1400" height="760" rx="36" fill="url(#bg)"/>
<text x="58" y="66" font-family="Inter,Arial" font-size="34" font-weight="900" fill="#172033">Arquitectura completa · Angular Aula</text>
<text x="58" y="102" font-family="Inter,Arial" font-size="16" fill="#64748b">Lee de arriba hacia abajo: interfaz → navegación → páginas → componentes → estado → persistencia/API.</text>

