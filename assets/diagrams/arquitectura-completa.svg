 <linearGradient id="state" x1="0" x2="1"><stop stop-color="#16a34a"/><stop offset="1" stop-color="#10b981"/></linearGradient>
 <filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#334155" flood-opacity=".13"/></filter>
 <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7c3aed"/></marker>
