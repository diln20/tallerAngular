<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Anatomía de un componente Angular</title><desc id="d">app.ts, app.html y app.css se unen mediante Component y generan el componente visible.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8f7ff"/><stop offset="1" stop-color="#eef8ff"/></linearGradient>
  <linearGradient id="ts" x1="0" x2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <linearGradient id="html" x1="0" x2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
  <linearGradient id="css" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="core" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#334155" flood-opacity=".14"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/></marker>
</defs>
<rect width="1200" height="560" rx="34" fill="url(#bg)"/>
<text x="60" y="68" font-family="Inter,Arial" font-size="32" font-weight="800" fill="#172033">Anatomía de un componente Angular</text>
<text x="60" y="102" font-family="Inter,Arial" font-size="16" fill="#64748b">Tres archivos, una sola responsabilidad visual y funcional.</text>

<g filter="url(#shadow)">
  <rect x="60" y="155" width="260" height="240" rx="26" fill="#fff"/>
  <rect x="60" y="155" width="260" height="58" rx="26" fill="url(#ts)"/>
  <text x="90" y="192" font-family="monospace" font-size="20" font-weight="800" fill="#fff">app.ts</text>
  <text x="88" y="250" font-family="Inter,Arial" font-size="18" font-weight="800" fill="#0f172a">Lógica</text>
  <text x="88" y="282" font-family="Inter,Arial" font-size="15" fill="#64748b">• propiedades</text>
  <text x="88" y="310" font-family="Inter,Arial" font-size="15" fill="#64748b">• Signals</text>
  <text x="88" y="338" font-family="Inter,Arial" font-size="15" fill="#64748b">• métodos</text>
  <text x="88" y="366" font-family="Inter,Arial" font-size="15" fill="#64748b">• imports</text>
</g>

<g filter="url(#shadow)">
  <rect x="360" y="155" width="260" height="240" rx="26" fill="#fff"/>
  <rect x="360" y="155" width="260" height="58" rx="26" fill="url(#html)"/>
  <text x="390" y="192" font-family="monospace" font-size="20" font-weight="800" fill="#fff">app.html</text>
  <text x="388" y="250" font-family="Inter,Arial" font-size="18" font-weight="800" fill="#0f172a">Vista</text>
  <text x="388" y="282" font-family="Inter,Arial" font-size="15" fill="#64748b">• estructura</text>
  <text x="388" y="310" font-family="Inter,Arial" font-size="15" fill="#64748b">• bindings</text>
  <text x="388" y="338" font-family="Inter,Arial" font-size="15" fill="#64748b">• eventos</text>
  <text x="388" y="366" font-family="Inter,Arial" font-size="15" fill="#64748b">• @if / @for</text>
</g>

<g filter="url(#shadow)">
  <rect x="660" y="155" width="260" height="240" rx="26" fill="#fff"/>
  <rect x="660" y="155" width="260" height="58" rx="26" fill="url(#css)"/>
  <text x="690" y="192" font-family="monospace" font-size="20" font-weight="800" fill="#fff">app.css</text>
  <text x="688" y="250" font-family="Inter,Arial" font-size="18" font-weight="800" fill="#0f172a">Estilos</text>
  <text x="688" y="282" font-family="Inter,Arial" font-size="15" fill="#64748b">• layout</text>
  <text x="688" y="310" font-family="Inter,Arial" font-size="15" fill="#64748b">• colores</text>
  <text x="688" y="338" font-family="Inter,Arial" font-size="15" fill="#64748b">• responsive</text>
  <text x="688" y="366" font-family="Inter,Arial" font-size="15" fill="#64748b">• estados visuales</text>
</g>

<path d="M320 275 C340 275 340 275 350 275" stroke="#7c3aed" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M620 275 C640 275 640 275 650 275" stroke="#7c3aed" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

<g filter="url(#shadow)">
  <rect x="960" y="205" width="180" height="140" rx="28" fill="url(#core)"/>
  <text x="1050" y="248" text-anchor="middle" font-family="Inter,Arial" font-size="16" font-weight="700" fill="#fff">@Component</text>
  <text x="1050" y="282" text-anchor="middle" font-family="Inter,Arial" font-size="24" font-weight="900" fill="#fff">APP</text>
  <text x="1050" y="314" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#fdf4ff">una sola unidad</text>
</g>
<path d="M920 275 L948 275" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="448" width="1080" height="62" rx="20" fill="#fff" opacity=".95"/>
<text x="88" y="486" font-family="Inter,Arial" font-size="16" font-weight="700" fill="#172033">Idea clave:</text>
<text x="185" y="486" font-family="Inter,Arial" font-size="16" fill="#64748b">TS decide qué hace, HTML qué se ve y CSS cómo se ve.</text>
</svg>