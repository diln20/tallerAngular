<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="t d">
<title id="t">Viaje del dato Ana</title><desc id="d">Ana viaja desde el formulario a ngModel, servicio, Signal, localStorage y tarjeta.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#fffafd"/><stop offset="1" stop-color="#f5fbff"/></linearGradient>
 <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#334155" flood-opacity=".12"/></filter>
 <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7c3aed"/></marker>
 <style>.flow{stroke-dasharray:9 7;animation:dash 1.8s linear infinite}@keyframes dash{to{stroke-dashoffset:-32}}</style>
</defs>
<rect width="1400" height="560" rx="36" fill="url(#bg)"/>
<text x="58" y="66" font-family="Inter,Arial" font-size="34" font-weight="900" fill="#172033">El viaje de un dato: “Ana”</text>
<text x="58" y="102" font-family="Inter,Arial" font-size="16" fill="#64748b">Sigue el mismo valor mientras atraviesa las capas de Angular Aula.</text>

<g filter="url(#s)">
 <rect x="55" y="200" width="185" height="150" rx="26" fill="#fff"/>
 <text x="147" y="240" text-anchor="middle" font-family="Inter,Arial" font-size="17" font-weight="900" fill="#172033">1 · Input</text>
 <rect x="80" y="260" width="135" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
 <text x="147" y="287" text-anchor="middle" font-family="Inter,Arial" font-size="14" fill="#1d4ed8">Ana</text>
 <text x="147" y="326" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">usuario escribe</text>
</g>
<path class="flow" d="M240 275H310" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/>

<g filter="url(#s)">
 <rect x="325" y="200" width="185" height="150" rx="26" fill="#f5f3ff" stroke="#c4b5fd"/>
 <text x="417" y="240" text-anchor="middle" font-family="Inter,Arial" font-size="17" font-weight="900" fill="#6d28d9">2 · ngModel</text>
 <text x="417" y="278" text-anchor="middle" font-family="monospace" font-size="11" fill="#7c3aed">formulario.nombre</text>
 <text x="417" y="313" text-anchor="middle" font-family="Inter,Arial" font-size="12" fill="#64748b">vale "Ana"</text>
</g>
<path class="flow" d="M510 275H580" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/>

<g filter="url(#s)">
 <rect x="595" y="185" width="210" height="180" rx="28" fill="#ecfeff" stroke="#67e8f9"/>
 <text x="700" y="230" text-anchor="middle" font-family="Inter,Arial" font-size="17" font-weight="900" fill="#0e7490">3 · Servicio</text>
 <text x="700" y="263" text-anchor="middle" font-family="monospace" font-size="11" fill="#155e75">agregar(datos)</text>
 <text x="700" y="300" text-anchor="middle" font-family="Inter,Arial" font-size="12" fill="#64748b">crea Estudiante</text>
 <text x="700" y="330" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f766e">{ nombre: 'Ana', ... }</text>
</g>
<path class="flow" d="M805 275H875" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/>

<g filter="url(#s)">
 <rect x="890" y="200" width="185" height="150" rx="26" fill="#ecfdf5" stroke="#86efac"/>
 <text x="982" y="240" text-anchor="middle" font-family="Inter,Arial" font-size="17" font-weight="900" fill="#166534">4 · Signal</text>
 <text x="982" y="278" text-anchor="middle" font-family="monospace" font-size="11" fill="#15803d">_estudiantes</text>
 <text x="982" y="313" text-anchor="middle" font-family="Inter,Arial" font-size="12" fill="#64748b">lista reactiva</text>
</g>
<path class="flow" d="M1075 275H1145" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/>

<g filter="url(#s)">
 <rect x="1160" y="200" width="185" height="150" rx="26" fill="#fdf2f8" stroke="#f9a8d4"/>
 <text x="1252" y="240" text-anchor="middle" font-family="Inter,Arial" font-size="17" font-weight="900" fill="#be185d">5 · Tarjeta</text>
 <text x="1252" y="278" text-anchor="middle" font-family="Inter,Arial" font-size="14" font-weight="800" fill="#9d174d">Ana</text>
 <text x="1252" y="313" text-anchor="middle" font-family="Inter,Arial" font-size="12" fill="#64748b">visible con @for</text>
</g>

<path class="flow" d="M982 350 C982 430 780 440 700 440 C550 440 455 410 417 365" stroke="#f59e0b" stroke-width="4" fill="none" marker-end="url(#a)"/>
<rect x="555" y="418" width="290" height="70" rx="22" fill="#fffbeb" stroke="#fde68a"/>
<text x="700" y="448" text-anchor="middle" font-family="Inter,Arial" font-size="15" font-weight="900" fill="#92400e">💾 localStorage</text>
<text x="700" y="474" text-anchor="middle" font-family="Inter,Arial" font-size="12" fill="#b45309">también conserva “Ana” para el siguiente F5</text>
</svg>